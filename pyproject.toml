[project]
name = "quantum-computing-camp"
version = "0.1.0"
description = "本源量子计算学习营示例与开发环境"
requires-python = ">=3.14,<3.15"
dependencies = ["pyqpanda3"]

[dependency-groups]
dev = [
    "commentjson>=0.9.0",
    "tomli-w>=1.2.0",
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
]

[tool.uv]
package = false
cache-dir = ".tmp/uv-cache"
python-install-mirror = "https://mirror.nju.edu.cn/github-release/astral-sh/python-build-standalone"

[[tool.uv.index]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true
